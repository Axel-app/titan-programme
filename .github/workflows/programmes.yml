name: Update

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: programme-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.PROGRAMME_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'schedule' || inputs.publish
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            output
          key: programme-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: programme-v1-
      - run: npm ci --no-audit --no-fund
        if: github.event_name == 'schedule' || inputs.publish
      # Pillow (thumbnails.py): its own folder, the runner's Python stays untouched.
      - name: Pillow
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --target .pydeps pillow==11.3.0
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.pydeps" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests -v
      - name: Collect
        run: python3 collect.py --refresh-minutes 30
      # Latest guide of the iptv-org grabbers (guides-grab.yml), if any.
      - uses: actions/cache/restore@v4
        with:
          path: grabbed
          key: iptvorg-guide-latest
          restore-keys: iptvorg-guide-
      # Schema 2: public guides are downloaded at most twice a day (conditional requests), the
      # day buckets only change with them, live.json follows the operator collection above.
      # A failure here never blocks the schema 1 publication.
      - name: Collect schema 2
        continue-on-error: true
        timeout-minutes: 12
        run: python3 collect_v2.py
      # Small copies of the pictures on air in the next hours (only the new ones each run).
      # A failure here never blocks the publication: the apps keep the original pictures.
      - name: Thumbnails
        continue-on-error: true
        timeout-minutes: 10
        run: python3 thumbnails.py
      - name: Cache
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            output
          key: programme-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export
        run: python3 export_static.py
      - name: Deploy
        if: github.event_name == 'schedule' || inputs.publish
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
